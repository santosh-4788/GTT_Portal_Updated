<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) report real
         numbers. Without it the app draws under the status bar and the gesture
         area with no way to detect either. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0B2C45" />
    <meta name="color-scheme" content="light" />
    <title>GTT Portal</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/mobile/main.tsx"></script>
  </body>
</html>
