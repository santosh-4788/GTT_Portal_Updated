<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600"
     role="img" aria-label="Gupta Tours And Travels — your journey, our priority">
  <title>Gupta Tours And Travels</title>

  <!--
    THE POSTER LOGO — built to match the reference layout.

    Composition, top to bottom: split G ring (steel left, gold right), Mumbai
    skyline inside it, curved road, sedan with a GUPTA plate, chrome GUPTA
    wordmark with a gold A, TOURS AND TRAVELS on a gold band with wings, four
    feature icons, script tagline, gold flourish.

    WHAT IS HONESTLY DIFFERENT FROM THE REFERENCE
    The reference's car is a photographic or 3D-rendered sedan with real
    reflections and lens glow. This is vector, drawn by hand — a clean
    illustration in the same silver-and-glass palette, but not a render. The
    chrome on the wordmark is layered gradients rather than a true bevel, so it
    reads as polished metal rather than extruded 3D.

    FONTS. GUPTA and the band are Sora, which the project ships. The tagline
    needs a script face and falls back through Segoe Script to generic cursive,
    so it will differ between machines. Convert all text to outlines before this
    goes to a printer or a signwriter.

    THIS IS A POSTER, NOT A LOGO — it cannot work at 44px in the site header or
    as a favicon. It is for a shop sign, a vehicle sticker, a WhatsApp profile,
    a brochure cover. The plain badge still has to exist for small sizes.
  -->

  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0%"   stop-color="#2A2F36"/>
      <stop offset="55%"  stop-color="#181C21"/>
      <stop offset="100%" stop-color="#0C0E11"/>
    </radialGradient>

    <linearGradient id="steel" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0%"   stop-color="#96A3B1"/>
      <stop offset="34%"  stop-color="#5A6673"/>
      <stop offset="68%"  stop-color="#2C333B"/>
      <stop offset="100%" stop-color="#171B20"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%"   stop-color="#FBEFA8"/>
      <stop offset="30%"  stop-color="#E8C860"/>
      <stop offset="62%"  stop-color="#C99B28"/>
      <stop offset="100%" stop-color="#F2DE8E"/>
    </linearGradient>

    <linearGradient id="goldFlat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#F6E39A"/>
      <stop offset="50%"  stop-color="#DDB44C"/>
      <stop offset="100%" stop-color="#B98D22"/>
    </linearGradient>

    <!-- polished metal for the wordmark -->
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="22%"  stop-color="#E4EAF0"/>
      <stop offset="46%"  stop-color="#8F9BA8"/>
      <stop offset="54%"  stop-color="#FDFEFF"/>
      <stop offset="78%"  stop-color="#B6C1CC"/>
      <stop offset="100%" stop-color="#6E7883"/>
    </linearGradient>

    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#6E8496"/>
      <stop offset="100%" stop-color="#232C35"/>
    </linearGradient>

    <linearGradient id="bodyPaint" x1="0.1" y1="0" x2="0.5" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="45%"  stop-color="#EDF1F5"/>
      <stop offset="100%" stop-color="#AFB9C4"/>
    </linearGradient>

    <linearGradient id="glassPaint" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%"   stop-color="#4E606F"/>
      <stop offset="100%" stop-color="#1B242C"/>
    </linearGradient>

    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#FFFFFF"   stop-opacity="0.95"/>
      <stop offset="35%"  stop-color="#BFE6FF"   stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7FC9FF"   stop-opacity="0"/>
    </radialGradient>

    <clipPath id="ringInside">
      <circle cx="300" cy="196" r="134"/>
    </clipPath>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>

  <!-- The upper composition is scaled and lifted as one group: at full
       size the ring's bottom edge ran through the top of GUPTA. -->
  <g transform="translate(0 -20) translate(300 190) scale(0.9) translate(-300 -190)">
  <!-- ================================================================
       THE SKYLINE, inside the ring
       ================================================================ -->
  <g clip-path="url(#ringInside)">
    <g fill="url(#tower)">
      <rect x="196" y="150" width="26" height="90"/>
      <rect x="226" y="126" width="20" height="114"/>
      <rect x="250" y="100" width="30" height="140"/>
      <rect x="284" y="78"  width="24" height="162"/>
      <rect x="312" y="108" width="28" height="132"/>
      <rect x="344" y="88"  width="22" height="152"/>
      <rect x="370" y="132" width="26" height="108"/>
      <rect x="400" y="158" width="18" height="82"/>
    </g>
    <!-- spires -->
    <g fill="#4A5C6D">
      <rect x="294" y="66" width="4" height="14"/>
      <rect x="353" y="76" width="4" height="14"/>
    </g>
    <!-- lit windows -->
    <g fill="#9FC4DC" opacity="0.5">
      <rect x="202" y="162" width="5" height="7"/><rect x="211" y="176" width="5" height="7"/>
      <rect x="231" y="140" width="5" height="7"/><rect x="236" y="158" width="5" height="7"/>
      <rect x="256" y="116" width="6" height="8"/><rect x="266" y="134" width="6" height="8"/>
      <rect x="290" y="94"  width="6" height="8"/><rect x="298" y="118" width="6" height="8"/>
      <rect x="318" y="124" width="6" height="8"/><rect x="328" y="146" width="6" height="8"/>
      <rect x="349" y="104" width="5" height="8"/><rect x="356" y="128" width="5" height="8"/>
      <rect x="376" y="148" width="6" height="8"/><rect x="384" y="170" width="6" height="8"/>
    </g>
  </g>

  <!-- ================================================================
       THE G — one ring, two halves, with a bar at three o'clock
       ================================================================ -->
  <g fill="none" stroke-width="30" stroke-linecap="butt">
    <!-- steel: from twelve, anticlockwise, round to six -->
    <path d="M 300 46 A 150 150 0 0 0 300 346" stroke="url(#steel)"/>
    <!-- gold: from twelve, clockwise, stopping short to open the G -->
    <path d="M 300 46 A 150 150 0 0 1 415 292" stroke="url(#gold)"/>
  </g>
  <!-- the bar that turns the ring into a G -->
  <rect x="330" y="181" width="122" height="30" fill="url(#gold)"/>

  <!-- ================================================================
       THE ROAD
       ================================================================ -->
  <path d="M 96 322 C 170 276, 300 262, 420 286 C 462 294, 492 306, 512 322
           L 512 340 C 486 322, 452 310, 414 302 C 300 280, 172 294, 96 342 Z"
        fill="#14181D"/>
  <path d="M 96 322 C 170 276, 300 262, 420 286 C 462 294, 492 306, 512 322"
        fill="none" stroke="url(#goldFlat)" stroke-width="5"/>
  <path d="M 104 334 C 176 288, 300 274, 418 296 C 458 304, 488 316, 506 332"
        fill="none" stroke="#E7EDF3" stroke-width="3.4"
        stroke-dasharray="15 19" opacity="0.75"/>

  <!-- ================================================================
       THE CAR — vector illustration, three-quarter-ish front
       ================================================================ -->
  <g>
    <!-- shadow on the road -->
    <ellipse cx="292" cy="300" rx="122" ry="13" fill="#000000" opacity="0.45"/>

    <!-- headlight glow, behind the body so it bleeds around the edge -->
    <ellipse cx="196" cy="258" rx="52" ry="30" fill="url(#lamp)"/>

    <!-- body -->
    <path d="M 176 292
             C 168 292, 163 287, 163 280
             L 163 268 C 163 258, 168 250, 178 245
             L 200 235 C 210 222, 222 213, 240 209
             C 268 203, 306 203, 334 209
             C 352 213, 366 223, 376 237
             L 398 247 C 408 252, 413 260, 413 270
             L 413 281 C 413 288, 408 292, 400 292
             Z"
          fill="url(#bodyPaint)"/>

    <!-- glasshouse -->
    <path d="M 210 234 C 219 221, 231 213, 246 210
             C 270 205, 304 205, 328 210
             C 343 213, 355 222, 364 234
             C 320 226, 254 226, 210 234 Z"
          fill="url(#glassPaint)"/>

    <!-- bonnet crease -->
    <path d="M 196 244 C 240 236, 336 236, 380 244"
          fill="none" stroke="#C6D0DA" stroke-width="2" opacity="0.9"/>

    <!-- grille -->
    <path d="M 236 268 C 268 262, 308 262, 340 268
             C 340 278, 336 283, 328 283 L 248 283
             C 240 283, 236 278, 236 268 Z"
          fill="#1B222A"/>
    <g stroke="#5C6874" stroke-width="2">
      <path d="M 244 271 H 332"/><path d="M 246 277 H 330"/>
    </g>

    <!-- headlights -->
    <path d="M 186 256 C 200 250, 218 248, 232 250 L 230 266
             C 214 264, 198 266, 186 270 Z" fill="#DCEEFF"/>
    <path d="M 390 256 C 376 250, 358 248, 344 250 L 346 266
             C 362 264, 378 266, 390 270 Z" fill="#DCEEFF"/>
    <circle cx="204" cy="258" r="5" fill="#FFFFFF"/>
    <circle cx="372" cy="258" r="5" fill="#FFFFFF"/>

    <!-- number plate -->
    <rect x="266" y="286" width="46" height="17" rx="3" fill="url(#goldFlat)"/>
    <text x="289" y="299" text-anchor="middle"
          font-family="'Sora', 'Segoe UI', system-ui, sans-serif"
          font-size="11" font-weight="800" fill="#1B222A">GUPTA</text>

    <!-- wheels, just showing below the arches -->
    <g fill="#14181D">
      <ellipse cx="192" cy="292" rx="21" ry="9"/>
      <ellipse cx="392" cy="292" rx="21" ry="9"/>
    </g>
  </g>

  </g>

  <!-- ================================================================
       THE WORDMARK
       ================================================================ -->
  <!-- the gold road sweeping out of the A. Drawn BEFORE the wordmark so it
       passes behind the letter and emerges to the right, rather than being
       laid over the top and reading as a line scored through it. -->
  <path d="M 396 426 C 428 415, 460 409, 494 407"
        fill="none" stroke="url(#goldFlat)" stroke-width="8" stroke-linecap="round"/>
  <path d="M 402 437 C 432 427, 460 421, 492 419"
        fill="none" stroke="#E7EDF3" stroke-width="3" stroke-linecap="round" opacity="0.55"/>

  <text x="300" y="428" text-anchor="middle"
        font-family="'Sora', 'Sora Variable', 'Segoe UI', system-ui, sans-serif"
        font-size="104" font-weight="800" letter-spacing="-1"
        stroke="#5B6672" stroke-width="1.6" paint-order="stroke">
    <tspan fill="url(#chrome)">GUPT</tspan><tspan fill="url(#gold)">A</tspan>
  </text>


  <!-- ================================================================
       THE BAND
       ================================================================ -->
  <g>
    <!-- wings -->
    <g fill="url(#goldFlat)">
      <rect x="54"  y="452" width="48" height="5" rx="2.5"/>
      <rect x="66"  y="462" width="36" height="5" rx="2.5"/>
      <rect x="498" y="452" width="48" height="5" rx="2.5"/>
      <rect x="498" y="462" width="36" height="5" rx="2.5"/>
    </g>
    <text x="300" y="470" text-anchor="middle"
          font-family="'Sora', 'Sora Variable', 'Segoe UI', system-ui, sans-serif"
          font-size="29" font-weight="800" letter-spacing="1.8" fill="url(#gold)">TOURS AND TRAVELS</text>
  </g>

  <!-- ================================================================
       THE FEATURE ROW
       ================================================================ -->
  <g font-family="'Sora', 'Segoe UI', system-ui, sans-serif" font-size="9.5"
     font-weight="700" letter-spacing="0.6" fill="#E7EDF3" text-anchor="middle">

    <!-- dividers -->
    <g stroke="#3A424B" stroke-width="1.4">
      <path d="M 195 500 V 534"/><path d="M 300 500 V 534"/><path d="M 405 500 V 534"/>
    </g>

    <!-- safe rides: shield with a tick -->
    <g transform="translate(143 512)">
      <path d="M 0 -13 L 11 -9 V 2 C 11 9, 5 13, 0 15 C -5 13, -11 9, -11 2 V -9 Z"
            fill="none" stroke="url(#goldFlat)" stroke-width="2.4"/>
      <path d="M -5 0 L -1.5 4 L 5.5 -4" fill="none" stroke="url(#goldFlat)"
            stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="143" y="546">SAFE RIDES</text>

    <!-- 24/7: clock -->
    <g transform="translate(248 512)">
      <circle cx="0" cy="0" r="13" fill="none" stroke="url(#goldFlat)" stroke-width="2.4"/>
      <path d="M 0 -7 V 0 L 5 4" fill="none" stroke="url(#goldFlat)"
            stroke-width="2.4" stroke-linecap="round"/>
    </g>
    <text x="248" y="546">24/7 SERVICE</text>

    <!-- comfortable: a seat -->
    <g transform="translate(353 512)">
      <rect x="-8" y="-13" width="9" height="18" rx="3.5"
            fill="none" stroke="url(#goldFlat)" stroke-width="2.4"/>
      <rect x="-8" y="4" width="19" height="8" rx="3.5"
            fill="none" stroke="url(#goldFlat)" stroke-width="2.4"/>
    </g>
    <text x="353" y="546">COMFORTABLE</text>

    <!-- customer first: people -->
    <g transform="translate(458 512)" fill="none" stroke="url(#goldFlat)" stroke-width="2.2">
      <circle cx="0" cy="-7" r="4.6"/>
      <path d="M -8 8 C -8 2, -4 -1, 0 -1 C 4 -1, 8 2, 8 8" stroke-linecap="round"/>
      <circle cx="-11" cy="-4" r="3.4"/>
      <circle cx="11"  cy="-4" r="3.4"/>
      <path d="M -17 8 C -17 3, -14 1, -11 1" stroke-linecap="round"/>
      <path d="M 17 8 C 17 3, 14 1, 11 1" stroke-linecap="round"/>
    </g>
    <text x="458" y="546">CUSTOMER FIRST</text>
  </g>

  <!-- ================================================================
       THE TAGLINE
       ================================================================ -->
  <text x="300" y="578" text-anchor="middle"
        font-family="'Segoe Script', 'Brush Script MT', 'Lucida Handwriting', cursive"
        font-size="25" fill="#F2F5F8">Your Journey, Our Priority</text>

  <path d="M 208 590 C 244 584, 356 584, 392 590"
        fill="none" stroke="url(#goldFlat)" stroke-width="2.2" stroke-linecap="round"/>
</svg>
