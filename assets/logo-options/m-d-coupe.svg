  <!--
    D · THE COUPE.

    A and B read as toys because the cabin was a tall dark dome sitting at
    mid-body. This sets the greenhouse back past centre, rakes the windscreen
    and drops the roof, over a long low bonnet — the difference between a coupe
    and a beetle. Solid, so nothing collapses at small sizes.

    Generated by scratchpad/draw-mark.py from the same stroke code as
    art-car-line.svg (scratchpad/strokekit.py). Do not hand-edit the path data.
    Fitted to 57 of the 64-unit box, leaving 4 units of clear space, and
    centred arithmetically — the header sets this hard against the wordmark, so
    the margin has to be real.
  -->

