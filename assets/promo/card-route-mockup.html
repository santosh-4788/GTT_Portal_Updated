<title>The Route Card Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600;700&display=swap">

<style>
  :root { --ink: #0B1723; --mut: #6E8194; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font-family: Inter, "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(120% 90% at 50% 0%, #F3F6FA 0%, #DFE7EF 55%, #CFDAE5 100%);
    -webkit-font-smoothing: antialiased;
  }

  .scene {
    width: 1400px; height: 940px; position: relative; overflow: hidden;
    display: grid; place-items: center;
  }
  /* a soft pool of light on the surface, so the cards sit on something */
  .scene::before {
    content: ""; position: absolute; width: 1100px; height: 620px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255,255,255,.9), rgba(255,255,255,0));
    filter: blur(6px);
  }

  .stack { position: relative; width: 1080px; height: 620px; }

  .card {
    position: absolute; width: 660px; height: 396px;   /* 90 x 54 at 7.33 px/mm */
    border-radius: 10px; overflow: hidden; background: #fff;
  }
  .card img { width: 100%; height: 100%; display: block; object-fit: cover; }

  /* Two cards on a surface: the back leaning away, the front resting on it.
     The shadows carry the height difference - that is what sells a mockup. */
  .card.back {
    left: 40px; top: 24px;
    transform: rotate(-7deg);
    box-shadow:
      0 2px 3px rgba(11,23,35,.16),
      0 26px 44px -18px rgba(11,23,35,.45);
  }
  .card.front {
    left: 372px; top: 190px;
    transform: rotate(4.5deg);
    box-shadow:
      0 2px 3px rgba(11,23,35,.18),
      0 40px 60px -22px rgba(11,23,35,.5);
  }
  /* the paper edge: a hairline of light along the top, shade along the bottom */
  .card::after {
    content: ""; position: absolute; inset: 0; border-radius: 10px; pointer-events: none;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.55), inset 0 -1px 0 rgba(11,23,35,.10);
  }

  .cap {
    position: absolute; left: 0; right: 0; bottom: 30px; text-align: center;
    font-size: 13px; font-weight: 600; letter-spacing: .16em;
    text-transform: uppercase; color: var(--mut);
  }
  .cap b { color: var(--ink); font-weight: 700; }

  /* ---------------------------------------------------------------- flats */
  .flats {
    width: 1400px; padding: 54px 90px 90px; display: grid; grid-template-columns: 1fr 1fr;
    gap: 40px; background: #EEF2F7;
  }
  .flat figcaption {
    margin-bottom: 14px; font-size: 12px; font-weight: 700; letter-spacing: .18em;
    text-transform: uppercase; color: var(--mut);
  }
  .flat img {
    width: 100%; display: block; border-radius: 6px;
    box-shadow: 0 1px 2px rgba(11,23,35,.14), 0 18px 34px -20px rgba(11,23,35,.4);
  }
  .note {
    grid-column: 1 / -1; margin: 8px 0 0; font-size: 13px; line-height: 1.6; color: var(--mut);
  }
  .note b { color: var(--ink); font-weight: 600; }
  .note code {
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px;
    background: #E2E9F1; padding: 2px 6px; border-radius: 4px; color: #2B3B4C;
  }
</style>
