# Nginx site for the Gupta Tours & Travels portal on a VPS.
# setup.sh copies this to /etc/nginx/sites-available/gtt and replaces
# __DOMAIN__ and __PORT__. Certbot then adds the HTTPS (443) block and the
# http -> https redirect to this same file.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    # OnSheet workbooks and vendor templates are uploaded through the API
    # (the app's own limit is 25 MB).
    client_max_body_size 30m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Invoice generation with LibreOffice can take a while.
        proxy_read_timeout 180s;
    }
}
